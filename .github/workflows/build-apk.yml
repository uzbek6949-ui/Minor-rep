# Minor Rep — APK'ni GitHub serverlarida quradi.
#
# Natija: har bir ishga tushishda tayyor APK fayl "Releases" bo'limida
# paydo bo'ladi — telefonning brauzeridan to'g'ridan-to'g'ri yuklab olib,
# o'rnatish mumkin. Kompyuterga hech narsa o'rnatish shart emas.
name: APK qurish

on:
  push:
    branches:
      - claude/flutter-music-app-13la66
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch: # GitHub saytidagi "Run workflow" tugmasi

permissions:
  contents: write # Release yaratish uchun

jobs:
  build:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Kodni olish
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter o'rnatish
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.5
          channel: stable
          cache: true

      - name: Paketlar
        run: flutter pub get

      - name: Tahlil (analyze)
        run: flutter analyze

      - name: Testlar
        # Dizayn golden rasmlari muhitga bog'liq — CI'da o'tkazib yuboriladi.
        run: flutter test --exclude-tags=preview

      - name: APK qurish
        run: flutter build apk --release

      - name: APK nomini belgilash
        id: apk
        run: |
          mkdir -p dist
          NAME="minor-rep-v1.0.${{ github.run_number }}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "dist/$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "dist/$NAME" | cut -f1)" >> "$GITHUB_OUTPUT"

      # 1-yo'l: Releases bo'limi — telefondan yuklab olish uchun eng qulayi
      - name: Release yaratish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-v1.0.${{ github.run_number }}"
          gh release create "$TAG" "dist/${{ steps.apk.outputs.name }}" \
            --title "Minor Rep v1.0.${{ github.run_number }}" \
            --notes "Telefon uchun tayyor APK (${{ steps.apk.outputs.size }}).

          **O'rnatish:** telefon brauzerida shu sahifani ochib, quyidagi \`.apk\` faylni bosing.
          Android \"noma'lum manbadan o'rnatish\"ga ruxsat so'rasa — ruxsat bering.

          Yangi versiyani o'rnatishdan oldin eskisini o'chirib tashlang.

          Commit: ${{ github.sha }}"

      # 2-yo'l: zaxira — Actions sahifasidagi artefakt
      - name: Artefakt sifatida saqlash
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: dist/*.apk
          retention-days: 30

      - name: Xulosa
        run: |
          echo "### ✅ APK tayyor: ${{ steps.apk.outputs.name }} (${{ steps.apk.outputs.size }})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Yuklab olish: [Releases sahifasi](${{ github.server_url }}/${{ github.repository }}/releases/latest)" >> "$GITHUB_STEP_SUMMARY"
