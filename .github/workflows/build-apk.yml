# Minor Rep — APK'ni GitHub serverlarida quradi.
#
# Natija: har bir ishga tushishda tayyor APK fayl "Releases" bo'limida
# paydo bo'ladi — telefonning brauzeridan to'g'ridan-to'g'ri yuklab olib,
# o'rnatish mumkin. Kompyuterga hech narsa o'rnatish shart emas.
name: APK qurish

on:
  push:
    branches:
      - claude/flutter-music-app-13la66
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch: # GitHub saytidagi "Run workflow" tugmasi

permissions:
  contents: write # Release yaratish uchun

jobs:
  build:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Kodni olish
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter o'rnatish
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.5
          channel: stable
          cache: true

      - name: Paketlar
        run: flutter pub get

      - name: Tahlil (analyze)
        run: flutter analyze

      - name: Testlar
        # Dizayn golden rasmlari muhitga bog'liq — CI'da o'tkazib yuboriladi.
        run: flutter test --exclude-tags=preview

      - name: APK qurish (har bir protsessor uchun alohida)
        # --split-per-abi: bitta katta fayl o'rniga 3 ta kichik APK.
        # Telefonga faqat bittasi kerak — hajmi ~2,5 barobar kichik.
        run: flutter build apk --release --split-per-abi

      - name: APK nomlarini belgilash
        id: apk
        run: |
          mkdir -p dist
          V="v1.0.${{ github.run_number }}"
          SRC=build/app/outputs/flutter-apk
          cp "$SRC/app-arm64-v8a-release.apk"   "dist/minor-rep-$V-arm64.apk"
          cp "$SRC/app-armeabi-v7a-release.apk" "dist/minor-rep-$V-arm32.apk"
          cp "$SRC/app-x86_64-release.apk"      "dist/minor-rep-$V-x86_64.apk"
          echo "name=minor-rep-$V-arm64.apk" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h dist/minor-rep-$V-arm64.apk | cut -f1)" >> "$GITHUB_OUTPUT"
          ls -lh dist/

      # 1-yo'l: Releases bo'limi — telefondan yuklab olish uchun eng qulayi
      - name: Release yaratish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-v1.0.${{ github.run_number }}"
          gh release create "$TAG" dist/*.apk \
            --title "Minor Rep v1.0.${{ github.run_number }}" \
            --notes "### Qaysi faylni olish kerak?

          **\`${{ steps.apk.outputs.name }}\`** (${{ steps.apk.outputs.size }}) — deyarli barcha zamonaviy telefonlar uchun. Shuni oling.

          Agar o'rnatilmasa (eski yoki juda arzon telefon): \`-arm32\` faylini sinab ko'ring.
          \`-x86_64\` — faqat emulyator uchun.

          **O'rnatish:** telefon brauzerida shu sahifani ochib, faylni bosing.
          Android \"noma'lum manbadan o'rnatish\"ga ruxsat so'rasa — ruxsat bering.
          Yangi versiyani o'rnatishdan oldin eskisini o'chirib tashlang.

          Commit: ${{ github.sha }}"

      # 3-yo'l: Telegram — APK to'g'ridan-to'g'ri telefonga keladi.
      # Ishlashi uchun repozitoriya sozlamalarida 2 ta "secret" bo'lishi kerak:
      #   TELEGRAM_BOT_TOKEN — @BotFather bergan token
      #   TELEGRAM_CHAT_ID   — kimga yuborilsin (sizning Telegram ID raqamingiz)
      # Ular qo'yilmagan bo'lsa, bu qadam shunchaki o'tkazib yuboriladi.
      - name: Telegramga yuborish
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APK: ${{ steps.apk.outputs.name }}
          SIZE: ${{ steps.apk.outputs.size }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "Telegram sozlanmagan — o'tkazib yuborildi." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          CAPTION="Minor Rep v1.0.${{ github.run_number }} ($SIZE)

          Faylni bosib o'rnating. Eski versiyani avval o'chiring."

          HTTP=$(curl -sS -o /tmp/tg.json -w '%{http_code}' \
            -F "chat_id=$CHAT_ID" \
            -F "caption=$CAPTION" \
            -F "document=@dist/$APK" \
            "https://api.telegram.org/bot$TOKEN/sendDocument")

          if [ "$HTTP" = "200" ]; then
            echo "Telegramga yuborildi: $APK" >> "$GITHUB_STEP_SUMMARY"
          else
            # Tokenni chiqarib yubormaslik uchun faqat xato tavsifini ko'rsatamiz.
            echo "Telegramga yuborilmadi (HTTP $HTTP):" >> "$GITHUB_STEP_SUMMARY"
            python3 -c "import json;print(json.load(open('/tmp/tg.json')).get('description','?'))" \
              >> "$GITHUB_STEP_SUMMARY" || true
            echo "Bu buildni to'xtatmaydi — APK Releases bo'limida bor." >> "$GITHUB_STEP_SUMMARY"
          fi

      # 2-yo'l: zaxira — Actions sahifasidagi artefakt
      - name: Artefakt sifatida saqlash
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: dist/*.apk
          retention-days: 30

      - name: Xulosa
        run: |
          echo "### ✅ APK tayyor: ${{ steps.apk.outputs.name }} (${{ steps.apk.outputs.size }})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Yuklab olish: [Releases sahifasi](${{ github.server_url }}/${{ github.repository }}/releases/latest)" >> "$GITHUB_STEP_SUMMARY"
