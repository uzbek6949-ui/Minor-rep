name: minor_rep
description: "Minor Rep — shaxsiy offline musiqa pleeri (Flutter)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.7.0 <4.0.0'
  flutter: '>=3.29.0'

dependencies:
  flutter:
    sdk: flutter

  # Audio
  just_audio: ^0.9.36
  just_audio_background: ^0.0.1-beta.11

  # Fayl tanlash
  file_picker: ^8.0.0+1

  # Lokal baza (internet shart emas)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Yo'llar, holat boshqaruvi, yordamchilar
  path_provider: ^2.1.2
  path: ^1.9.0
  provider: ^6.1.2
  rxdart: ^0.27.7
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  # Ilova ikonkasini generatsiya qilish uchun (faqat ishlab chiqishda)
  flutter_launcher_icons: ^0.14.1

# Ikonka sozlamalari — yangilash uchun: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: "ic_launcher"
  min_sdk_android: 23
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  ios: true
  remove_alpha_ios: true

flutter:
  uses-material-design: true
